# Pull requests for dependency updates: security fixes as soon as they are
# published, the rest once a week, grouped so they arrive as one PR each.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # the workflows pin actions to commits; this keeps those pins current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
