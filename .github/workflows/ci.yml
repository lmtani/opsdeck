name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q

      # Fail early, with a clear message, when the lock is out of date with
      # pyproject: the image build uses --frozen.
      - name: Lock is up to date
        run: uv lock --check
