name: CI

on:
  pull_request:
  push:
    branches: [main]

# every job only reads the repository; nothing here writes to GitHub
permissions:
  contents: read

jobs:
  # The same hooks as `pre-commit install` runs locally, over every file.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # the hook only sees staged changes; here every commit is checked
      - name: Secrets in history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  tests:
    runs-on: ubuntu-latest

    # the SQL repository tests run on SQLite and, through this service, MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: opsdeck
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -popsdeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q
        env:
          OPSDECK_TEST_MYSQL_URL: mysql+pymysql://root:opsdeck@127.0.0.1:3306/opsdeck_test

      # Fail early, with a clear message, when the lock is out of date with
      # pyproject: the image build uses --frozen.
      - name: Lock is up to date
        run: uv lock --check

  # What `uv tool install` gets: the wheel must carry the web assets and the
  # migrations, and run outside the clone. Like `uv tool install`, it resolves
  # the dependencies afresh (no lock), on Linux and on Apple silicon macOS.
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: uv build

      - name: Install and serve
        working-directory: ${{ runner.temp }}
        env:
          OPSDECK_DATA_DIR: ${{ runner.temp }}/opsdeck-data
          WHEEL_DIR: ${{ github.workspace }}/dist
        run: |
          uv tool install "$WHEEL_DIR"/*.whl
          opsdeck --version
          opsdeck info
          python3 -c "import platform; print(platform.system(), platform.machine())"
          opsdeck &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
          for path in / /js/main.js /css/app.css /manifest.json; do
            curl -sf -o /dev/null "http://127.0.0.1:8765$path" || { echo "missing $path"; exit 1; }
          done
          test -f "$OPSDECK_DATA_DIR/opsdeck.db"

  # The image must build and start on both architectures. arm64 runs under
  # QEMU emulation; once the repository is public it can move to the native
  # `ubuntu-24.04-arm` runners, which are free for public repositories.
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: opsdeck:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Imports every native extension the app loads (TLS, sqlite, gRPC,
      # cryptography, pydantic) plus the whole app, inside the built image.
      - name: Smoke test
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint /app/.venv/bin/python opsdeck:ci -c \
            "import platform, ssl, sqlite3, ctypes, grpc, cryptography.hazmat.bindings._rust, pydantic_core, opsdeck.bootstrap; print('ok', platform.machine())"

      # The entrypoint starts the server, which creates its SQLite file in the
      # data directory and serves the page.
      - name: Start
        run: |
          docker run -d --name opsdeck --platform ${{ matrix.platform }} -p 127.0.0.1:8080:8080 opsdeck:ci
          for _ in $(seq 120); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8080/ || { docker logs opsdeck; exit 1; }
