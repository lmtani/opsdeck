name: Security

# New vulnerabilities are published for dependencies that did not change, so
# the lock is audited every week, not only when a PR touches it.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: pip-audit
        run: uv export --frozen --all-groups --no-emit-project -q | uv run --frozen pip-audit --disable-pip --require-hashes -r /dev/stdin --progress-spinner off
