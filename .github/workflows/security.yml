name: Security

# New vulnerabilities are published for dependencies that did not change, so
# the lock is audited every week, not only when a PR touches it.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: pip-audit
        run: uv export --frozen --all-groups --no-emit-project -q | uv run --frozen pip-audit --disable-pip --require-hashes -r /dev/stdin --progress-spinner off
