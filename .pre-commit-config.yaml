# Install once with `uv run pre-commit install`; CI runs the same hooks on every file.
# Python tools run through uv, so their versions come from uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # secrets (tokens, keys, credentials) must never reach this public repository
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock
        name: uv lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # known vulnerabilities in the locked dependencies (needs the network, so
      # only when the lock changes; CI also runs it every week)
      - id: pip-audit
        name: pip-audit (dependency vulnerabilities)
        entry: bash -c 'uv export --frozen --all-groups --no-emit-project -q | uv run --frozen pip-audit --disable-pip --require-hashes -r /dev/stdin --progress-spinner off'
        language: system
        files: ^uv\.lock$
        pass_filenames: false
      # GitHub Actions: actions pinned to commits, least privilege, no injection
      - id: zizmor
        name: zizmor (workflow security)
        entry: uv run --frozen zizmor --offline .github/workflows
        language: system
        files: ^\.github/workflows/
        pass_filenames: false

  # frontend: lint and format the static JS and CSS
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.3
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.6.3"]
