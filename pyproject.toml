[project]
name = "opsdeck"
version = "0.1.0"
description = "Painel pessoal de devops: atalhos, consultas ao Cloud Logging e feeds de atividade do GitHub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48.0.1",
    "fastapi>=0.136.3",
    "google-cloud-logging>=3.10",
    "httpx>=0.28.1",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
