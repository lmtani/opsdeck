[project]
name = "opsdeck"
version = "0.1.0"
description = "Personal devops dashboard: link cards, saved Cloud Logging queries and GitHub activity feeds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "cryptography>=50.0.2",
    "fastapi>=0.136.3",
    "google-cloud-logging>=3.10",
    "httpx>=0.28.1",
    "nh3>=0.3.7",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.0.3",
    "ruff>=0.17.3",
    "zizmor>=1.31.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "secrets"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplifications
    "C4",           # comprehensions
    "PIE", "RET", "PERF",
    "PT",           # pytest style
    "S",            # bandit security checks
    "PLE", "PLW",   # pylint errors and warnings
    "RUF",
]
ignore = [
    "C408",   # dict(id=...) reads well in builders and fakes
    "PT018",  # tests assert related facts together on purpose
    "SIM103", # a run of guard clauses ending in `return True` reads better than one folded condition
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",                   # assert is how pytest works
    "S105", "S106", "S107",   # fake tokens and passwords
]
# column lists are module constants; values always go as query parameters
"app/infrastructure/persistence/mysql/repositories.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
